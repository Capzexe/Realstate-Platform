; EXAMPLE for the web PHP-FPM/Apache SAPI, not the CLI used by Composer/Artisan.
; Install a current patched PHP version first. Adjust paths for your server.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /var/log/verisale/php-error.log

; Extra containment only: OS ownership/permissions remain the security boundary.
; Include your real release/shared paths, temp directory and CA certificate directory.
; open_basedir disables PHP's realpath cache; measure performance after enabling.
open_basedir = /srv/verisale:/tmp:/etc/ssl/certs
allow_url_include = Off
allow_url_fopen = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; No browser upload endpoint exists. Enable only after adding authenticated validation.
file_uploads = Off
upload_max_filesize = 2M
post_max_size = 256K
max_input_vars = 100
max_input_nesting_level = 8
max_execution_time = 30
max_input_time = 30
memory_limit = 128M

; Laravel manages sessions itself; these also protect any native PHP session usage.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
zend.exception_ignore_args = On

; Do not use the sendmail transport with process functions disabled. Use SMTP.
; Laravel's HTTP client uses cURL, so allow_url_fopen is not needed for Stripe.
