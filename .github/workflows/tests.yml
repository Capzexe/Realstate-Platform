name: PHP checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Validate and install dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Prepare a disposable demo database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --no-interaction

      - name: Check formatting
        run: php vendor/bin/pint --test

      - name: Run application and security tests
        run: composer test

      - name: Audit dependencies
        run: composer audit --locked

      - name: Set up Node for browser checks only
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser tooling
        run: |
          npm ci
          npm run browser:install -- --with-deps

      - name: Check real browser purchase and validation flows
        run: npm run test:browser

      - name: Measure mobile Lighthouse performance (report, no score gate)
        run: npm run perf

      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
            artifacts/performance/
            artifacts/review/
          retention-days: 7
          if-no-files-found: ignore
